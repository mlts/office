# Dependabot configuration for LibreOffice/core
# Intended for a writable fork of LibreOffice.
#
# https://docs.github.com/code-security/dependabot/
# dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  # Git submodules
  # LibreOffice uses submodules for dictionaries,
  # helpcontent2, and translations.
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Rome"

    open-pull-requests-limit: 3

    commit-message:
      prefix: "chore(deps)"

    labels:
      - "dependencies"
